    <!-- SCRIPT DE CONEXIÓN A MONGODB -->
    <script>
        async function cargarProductos() {
            try {
                const respuesta = await fetch('http://localhost:3000/api/productos');
                const productos = await respuesta.json();
                
                const contenedor = document.getElementById('contenedor-productos');
                contenedor.innerHTML = ''; 

                productos.forEach(producto => {
                    const cardHTML = `
                        <div class="col">
                            <div class="card h-100 border-0 shadow-sm rounded-4 text-center p-3">
                                <div class="text-end mb-2">
                                    <span class="badge bg-success"><i class="bi bi-shield-check"></i> 0 Riesgo</span>
                                </div>
                                <div class="bg-secondary bg-opacity-10 rounded-3 p-4 mb-3 d-flex align-items-center justify-content-center" style="height: 180px;">
                                    <i class="bi bi-pc-display-horizontal display-1 text-dark"></i>
                                </div>
                                <div class="card-body p-0 d-flex flex-column">
                                    <h5 class="card-title fw-bold">${producto.nombre}</h5>
                                    <p class="card-text text-muted small">${producto.descripcion_corta}</p>
                                    <p class="text-primary small mb-3"><i class="bi bi-tools"></i> Incluye manual y herramientas</p>
                                    <p class="fw-bold fs-5 mt-auto">$${producto.precio.toLocaleString()} MXN</p>
                                    <button class="btn btn-dark rounded-pill w-100 mt-2">Validar Compatibilidad</button>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += cardHTML;
                });

            } catch (error) {
                console.error("Error al conectar con el backend:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', cargarProductos);
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <!-- SCRIPT DEL MAPA INTERACTIVO -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Coordenadas fijas del ITSOEH
            const coordenadasITSOEH = [20.2055, -99.2218];

            const mapa = L.map('contenedorMapa').setView(coordenadasITSOEH, 13);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
             maxZoom: 19,
            attribution: '© OpenStreetMap contributors © CARTO'
            }).addTo(mapa);
            
            L.marker(coordenadasITSOEH)
                .addTo(mapa)
                .bindPopup('<b>ITSOEH</b><br>Destino fijo.')
                .openPopup();

            let controlRutas = null;

            mapa.on('click', function(e) {
                const puntoOrigen = e.latlng;

                if (controlRutas !== null) {
                    mapa.removeControl(controlRutas);
                }

                controlRutas = L.Routing.control({
                    waypoints: [
                        L.latLng(puntoOrigen.lat, puntoOrigen.lng),
                        L.latLng(coordenadasITSOEH[0], coordenadasITSOEH[1])
                    ],
                    routeWhileDragging: true,
                    language: 'es', 
                    createMarker: function(i, wp, nWps) {
                        if (i === 0) {
                            return L.marker(wp.latLng).bindPopup('Punto de partida');
                        } else {
                            return L.marker(wp.latLng).bindPopup('ITSOEH');
                        }
                    }
                }).addTo(mapa);
            });
        });
    </script>
